<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QuizHub – Premium Online Test Platform</title>
<meta name="description" content="QuizHub is a free online test platform for Class 9, 10, 11 and 12 students of Bihar Board and CBSE. Timed subject tests, instant results and progress tracking.">
<meta name="theme-color" content="#05071a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237c5cff'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3EQ%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#05071a;--bg2:#0a1030;--card:rgba(16,22,66,.72);--card-solid:#0f1640;--line:rgba(90,170,255,.2);
  --text:#e8ecff;--muted:#8f9bc7;--blue:#12d6ff;--purple:#9b5cff;--pink:#ff3df5;--green:#2bff9e;--red:#ff4d6d;--amber:#ffd23f;
  --grad:linear-gradient(135deg,#12d6ff 0%,#7a5cff 55%,#ff3df5 100%);--shadow:0 10px 30px rgba(0,0,0,.45);--r:18px;
  --glow:0 0 0 1px rgba(18,214,255,.4),0 0 26px rgba(18,214,255,.28);
}
[data-theme="light"]{
  --bg:#eef2ff;--bg2:#e3e9ff;--card:rgba(255,255,255,.82);--card-solid:#ffffff;--line:rgba(80,100,200,.18);
  --text:#161c3d;--muted:#5d6894;--shadow:0 10px 26px rgba(60,80,180,.16);--glow:0 0 0 1px rgba(62,120,255,.2),0 8px 24px rgba(62,120,255,.14);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(900px 500px at 8% -10%,rgba(18,214,255,.2),transparent 60%),radial-gradient(800px 500px at 100% 0,rgba(155,92,255,.24),transparent 60%),radial-gradient(700px 500px at 50% 110%,rgba(255,61,245,.14),transparent 60%),var(--bg)}
a{color:var(--blue);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{max-width:100%;display:block}
h1,h2,h3{line-height:1.2}
.hidden{display:none!important}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:14px;font-weight:700;font-size:.95rem;transition:transform .15s,box-shadow .15s,opacity .15s;white-space:nowrap;min-height:44px}
.btn:active{transform:translateY(2px)}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 5px 0 #4a2fb0,0 10px 22px rgba(139,92,246,.35)}
.btn-primary:active{box-shadow:0 2px 0 #4a2fb0}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--text)}
.btn-danger{background:linear-gradient(135deg,#ff5c7a,#d6336c);color:#fff;box-shadow:0 5px 0 #8f1d45}
.btn-success{background:linear-gradient(135deg,#27e0a3,#12a37a);color:#04281d;box-shadow:0 5px 0 #0b6b50}
.btn-sm{padding:7px 12px;font-size:.82rem;min-height:36px;border-radius:11px}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:1.1rem}

/* ---------- Cards / layout ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card.flat{backdrop-filter:none;-webkit-backdrop-filter:none}
.card h2{font-size:1.05rem;margin-bottom:12px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}.small{font-size:.82rem}.tiny{font-size:.72rem}
.center{text-align:center}
.stack>*+*{margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:.74rem;font-weight:700;background:rgba(62,166,255,.14);color:var(--blue);border:1px solid rgba(62,166,255,.3)}
.chip.green{background:rgba(39,224,163,.13);color:var(--green);border-color:rgba(39,224,163,.3)}
.chip.red{background:rgba(255,92,122,.13);color:var(--red);border-color:rgba(255,92,122,.3)}
.chip.amber{background:rgba(255,194,62,.13);color:var(--amber);border-color:rgba(255,194,62,.3)}
.chip.purple{background:rgba(139,92,246,.16);color:#b79cff;border-color:rgba(139,92,246,.35)}
.divider{height:1px;background:var(--line);margin:14px 0}

/* ---------- Forms ---------- */
label.f{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin:10px 0 5px}
.in,select.in,textarea.in{width:100%;background:rgba(10,16,45,.5);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none;transition:border .15s,box-shadow .15s;min-height:44px}
[data-theme="light"] .in{background:#fff}
.in:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(62,166,255,.2)}
select.in option{background:var(--card-solid);color:var(--text)}
textarea.in{min-height:84px;resize:vertical}
.check{display:flex;gap:10px;align-items:center;font-size:.9rem;margin:8px 0;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--purple)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}

/* ---------- App shell ---------- */
.shell{display:grid;grid-template-columns:1fr;min-height:100vh}
.side{display:none}
.main{padding:16px 14px 96px;max-width:1180px;width:100%;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.3rem;letter-spacing:.5px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:900;font-size:1.3rem;box-shadow:0 4px 0 #4a2fb0,0 8px 18px rgba(139,92,246,.4);overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-around;background:var(--card-solid);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;color:var(--muted);padding:6px 2px;border-radius:12px;font-weight:700}
.bnav a .i{font-size:1.25rem}
.bnav a.on{color:var(--blue)}
@media(min-width:900px){
  .shell{grid-template-columns:250px 1fr}
  .side{display:flex;flex-direction:column;gap:6px;padding:20px 14px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:rgba(10,15,40,.55)}
  [data-theme="light"] .side{background:rgba(255,255,255,.6)}
  .side a.nv{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;color:var(--muted);font-weight:700}
  .side a.nv:hover{background:var(--card)}
  .side a.nv.on{background:var(--grad);color:#fff;box-shadow:0 4px 0 #4a2fb0}
  .bnav{display:none}
  .main{padding:26px 28px 40px}
}

/* ---------- 3D stat tiles ---------- */
.tile{position:relative;border-radius:var(--r);padding:16px;background:linear-gradient(160deg,rgba(62,166,255,.22),rgba(139,92,246,.2));border:1px solid var(--line);box-shadow:0 6px 0 rgba(0,0,0,.28),var(--shadow);transition:transform .2s}
.tile .k{font-size:.74rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.tile .v{font-size:1.9rem;font-weight:900;margin-top:2px}
.tile .e{position:absolute;right:12px;top:10px;font-size:1.6rem;opacity:.85}
@media(hover:hover){.tile:hover,.t3d:hover{transform:perspective(700px) rotateX(3deg) translateY(-3px)}}
.t3d{transition:transform .2s}

.hero{background:linear-gradient(135deg,rgba(62,166,255,.28),rgba(139,92,246,.32));border-radius:22px;padding:20px;border:1px solid var(--line);display:flex;gap:16px;align-items:center;box-shadow:var(--shadow)}
.avatar{width:62px;height:62px;border-radius:20px;background:var(--grad);display:grid;place-items:center;font-size:1.7rem;font-weight:900;color:#fff;flex:none;box-shadow:0 5px 0 #4a2fb0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}

/* progress */
.bar{height:10px;border-radius:99px;background:rgba(120,150,255,.16);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--grad);width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar.g>i{background:linear-gradient(90deg,#27e0a3,#3ea6ff)}.bar.r>i{background:linear-gradient(90deg,#ff5c7a,#ffc23e)}

/* test cards */
.tcard{display:flex;flex-direction:column;gap:8px;cursor:pointer;text-decoration:none;color:inherit}
.tcard h3{font-size:1rem}
.folder{display:flex;align-items:center;gap:14px;padding:18px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:0 6px 0 rgba(0,0,0,.25),var(--shadow);cursor:pointer;text-align:left;width:100%}
.folder .fi{font-size:2rem;width:56px;height:56px;border-radius:16px;background:var(--grad);display:grid;place-items:center;flex:none}
.folder b{font-size:1.1rem;display:block}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted);margin-bottom:14px}
.crumbs a{color:var(--blue);font-weight:700}
.list-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.rankno{width:32px;height:32px;border-radius:10px;background:rgba(120,150,255,.16);display:grid;place-items:center;font-weight:900;flex:none}
.rankno.r1{background:linear-gradient(135deg,#ffd75e,#ff9f1c);color:#3d2600}.rankno.r2{background:linear-gradient(135deg,#e0e6f5,#98a3c4);color:#222}.rankno.r3{background:linear-gradient(135deg,#f0a36b,#b4622a);color:#2b1300}

/* ---------- Toasts / modal ---------- */
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{pointer-events:auto;background:var(--card-solid);border:1px solid var(--line);border-left:4px solid var(--blue);padding:12px 14px;border-radius:14px;box-shadow:var(--shadow);font-size:.9rem;animation:tin .25s ease}
.toast.ok{border-left-color:var(--green)}.toast.error{border-left-color:var(--red)}.toast.warn{border-left-color:var(--amber)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.ov{position:fixed;inset:0;z-index:200;background:rgba(3,6,20,.72);display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fin .15s}
.ov .mbox{background:var(--card-solid);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:760px;max-height:92vh;overflow:auto;padding:20px;box-shadow:var(--shadow)}
.mbox.sm{max-width:440px}
@media(min-width:700px){.ov{align-items:center;padding:20px}.ov .mbox{border-radius:22px}}
@keyframes fin{from{opacity:0}to{opacity:1}}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.mhead h2{font-size:1.15rem}

/* ---------- Auth ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth .box{width:min(100%,440px)}
.tabs{display:flex;background:rgba(120,150,255,.12);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px;overflow-x:auto}
.tabs button{flex:1;padding:9px 12px;border-radius:11px;font-weight:700;color:var(--muted);white-space:nowrap;font-size:.88rem}
.tabs button.on{background:var(--grad);color:#fff}
.foot{margin-top:24px;text-align:center;font-size:.8rem;color:var(--muted)}
.foot a{margin:0 8px;display:inline-block;padding:4px 0}

/* ---------- Ads ---------- */
.adbox{border:1px dashed var(--line);border-radius:14px;padding:8px;margin:14px 0;text-align:center;min-height:90px;background:rgba(120,150,255,.05);overflow:hidden}
.adbox .adl{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.adbox img{margin:auto;max-height:260px;border-radius:10px}

/* ---------- Exam ---------- */
.exam{min-height:100vh;display:flex;flex-direction:column}
.ehead{position:sticky;top:0;z-index:40;background:var(--card-solid);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:1.15rem;padding:7px 14px;border-radius:12px;background:rgba(62,166,255,.15);color:var(--blue);border:1px solid rgba(62,166,255,.35)}
.timer.low{background:rgba(255,92,122,.16);color:var(--red);border-color:rgba(255,92,122,.4);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.ebody{flex:1;display:grid;gap:14px;padding:14px;max-width:1200px;width:100%;margin:0 auto;grid-template-columns:1fr}
@media(min-width:900px){.ebody{grid-template-columns:1fr 300px;align-items:start}}
.qtext{font-size:1.08rem;font-weight:600;white-space:pre-wrap;word-break:break-word}
.qimg{margin:12px 0;border-radius:14px;max-height:300px;object-fit:contain;background:#fff}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;margin-top:10px;border-radius:15px;background:rgba(120,150,255,.08);border:2px solid var(--line);transition:.15s;min-height:52px}
.opt .l{width:30px;height:30px;border-radius:9px;background:rgba(120,150,255,.2);display:grid;place-items:center;font-weight:900;flex:none}
.opt.sel{border-color:var(--blue);background:rgba(62,166,255,.16);box-shadow:var(--glow)}
.opt.sel .l{background:var(--grad);color:#fff}
.opt span.t{padding-top:3px;word-break:break-word;white-space:pre-wrap}
.ebar{position:sticky;bottom:0;background:var(--card-solid);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:8px}
.pal button{height:40px;border-radius:11px;font-weight:800;background:rgba(120,150,255,.12);border:2px solid transparent;font-size:.88rem}
.pal button.vis{background:rgba(255,92,122,.18);color:var(--red)}
.pal button.ans{background:rgba(39,224,163,.2);color:var(--green)}
.pal button.mrk{background:rgba(139,92,246,.3);color:#c7b3ff}
.pal button.cur{border-color:var(--blue);box-shadow:var(--glow)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.72rem;margin-top:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:4px;vertical-align:-1px}
.palwrap{display:none}
@media(min-width:900px){.palwrap{display:block;position:sticky;top:70px}.palbtn{display:none}}
.palwrap.open{display:block;position:fixed;left:0;right:0;bottom:0;z-index:150;max-height:70vh;overflow:auto;border-radius:22px 22px 0 0}
@media(min-width:900px){.palwrap.open{position:sticky;top:70px;max-height:none;border-radius:var(--r)}}
.sync{font-size:.7rem;padding:3px 8px;border-radius:99px;background:rgba(39,224,163,.14);color:var(--green)}
.sync.off{background:rgba(255,194,62,.16);color:var(--amber)}

/* ---------- Result ---------- */
.rhero{text-align:center;padding:26px 16px;border-radius:26px;background:linear-gradient(160deg,rgba(62,166,255,.25),rgba(139,92,246,.32) 60%,rgba(255,79,216,.18));border:1px solid var(--line);box-shadow:0 8px 0 rgba(0,0,0,.28),var(--shadow);position:relative;overflow:hidden}
.score{font-size:3.6rem;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.badge3d{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 8px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .2s}
.badge3d .b{font-size:2.1rem;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.badge3d.locked{opacity:.4;filter:grayscale(1)}
.ring text{fill:var(--text);font-weight:800}
.qa{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;background:rgba(120,150,255,.05)}
.qa .o{padding:8px 10px;border-radius:10px;margin-top:6px;border:1px solid var(--line);font-size:.92rem;display:flex;gap:8px}
.qa .o.ok{background:rgba(39,224,163,.15);border-color:rgba(39,224,163,.5)}
.qa .o.bad{background:rgba(255,92,122,.15);border-color:rgba(255,92,122,.5)}
.expl{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(62,166,255,.1);border-left:3px solid var(--blue);font-size:.9rem;white-space:pre-wrap}
.svgc text{fill:var(--muted);font-size:10px}

/* ---------- Admin ---------- */
.atabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;scrollbar-width:thin}
.atabs a{padding:9px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-weight:700;white-space:nowrap;font-size:.88rem}
.atabs a.on{background:var(--grad);color:#fff;border-color:transparent}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t th,table.t td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
table.t th{font-size:.72rem;text-transform:uppercase;color:var(--muted);letter-spacing:.5px}
.scroll-x{overflow-x:auto}
.hbar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:.82rem}
.hbar .n{width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.hbar .bar{flex:1}
.hbar .c{width:34px;text-align:right;font-weight:800}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.loader{display:grid;place-items:center;min-height:50vh}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid rgba(120,150,255,.2);border-top-color:var(--blue);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.consent{position:fixed;left:12px;right:12px;bottom:84px;z-index:120;max-width:560px;margin:auto;background:var(--card-solid);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
@media(min-width:900px){.consent{bottom:20px;left:270px}}
.page{max-width:780px;margin:0 auto}
.page h1{font-size:1.6rem;margin-bottom:10px}.page h3{margin:18px 0 6px}.page p,.page li{color:var(--muted);margin-bottom:8px}.page ul{padding-left:20px}
code.k{background:rgba(120,150,255,.16);padding:2px 6px;border-radius:6px;font-size:.85em;word-break:break-all}
pre.k{background:rgba(0,0,0,.35);padding:12px;border-radius:12px;overflow:auto;font-size:.8rem;color:#cfe0ff}
.mascot{display:block;overflow:visible;flex:none}
.mascot .m-body{animation:bob 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.mascot .m-eyes{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
.mascot .m-pupil{animation:look 7s ease-in-out infinite}
.mascot .mo,.mascot .m-brow,.mascot .m-spark{display:none}
.m-happy .mo-happy,.m-sad .mo-sad,.m-wow .mo-wow,.m-cheer .mo-cheer,.m-think .mo-think,.m-think .m-brow,.m-cheer .m-spark{display:inline}
.m-cheer .m-body{animation:hop .55s ease-in-out infinite}
.m-cheer .m-spark{animation:twinkle .8s infinite}
.m-sad .m-body{animation:bob 5.5s ease-in-out infinite}
.m-wow .m-eyes{animation:none;transform:scale(1.12)}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes hop{50%{transform:translateY(-9px) rotate(3deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
@keyframes look{0%,100%{transform:translateX(0)}30%{transform:translateX(-2px)}60%{transform:translate(2px,-1px)}}
@keyframes twinkle{50%{opacity:.2}}
.bubble{position:relative;background:var(--card-solid);border:1px solid var(--line);border-radius:16px;padding:10px 14px;font-size:.9rem;box-shadow:var(--shadow)}

/* =====================================================================
   SVG / animation helpers
   ===================================================================== */
function ringSVG(pct, { size = 108, stroke = 11, color = '#3ea6ff', label = '' } = {}) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - Math.min(100, Math.max(0, pct)) / 100), m = size / 2;
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(label)}">
   <circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="rgba(120,150,255,.2)" stroke-width="${stroke}"/>
   <circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${off}" style="transition:stroke-dashoffset 1s ease" transform="rotate(-90 ${m} ${m})"/>
   <text x="50%" y="50%" text-anchor="middle" dy=".35em" font-size="${size * .21}">${esc(label)}</text></svg>`;
}
function donutSVG(parts) {
  const total = parts.reduce((a, p) => a + p.v, 0) || 1, r = 40, c = 2 * Math.PI * r; let acc = 0;
  return `<svg width="150" height="150" viewBox="0 0 100 100" role="img" aria-label="Answer breakdown"><circle cx="50" cy="50" r="${r}" fill="none" stroke="rgba(120,150,255,.15)" stroke-width="14"/>
  ${parts.filter(p => p.v > 0).map(p => { const len = p.v / total * c; const s = `<circle cx="50" cy="50" r="${r}" fill="none" stroke="${p.color}" stroke-width="14" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-acc}" transform="rotate(-90 50 50)"/>`; acc += len; return s; }).join('')}
  <text x="50" y="54" text-anchor="middle" font-size="14" font-weight="800" fill="currentColor">${total === 1 && !parts.some(p => p.v) ? 0 : parts.reduce((a, p) => a + p.v, 0)}</text></svg>`;
}
function lineSVG(pts) {
  if (!pts.length) return `<div class="empty">No attempts yet</div>`;
  const W = 340, H = 150, px = 28, py = 16, n = pts.length;
  const X = i => n === 1 ? W / 2 : px + i * (W - px - 10) / (n - 1), Y = v => H - py - (Math.min(100, Math.max(0, v)) / 100) * (H - py * 2);
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  return `<svg class="svgc" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Performance over time">
   ${[0, 50, 100].map(g => `<line x1="${px}" x2="${W - 6}" y1="${Y(g)}" y2="${Y(g)}" stroke="rgba(120,150,255,.2)" stroke-dasharray="3 4"/><text x="2" y="${Y(g) + 3}">${g}%</text>`).join('')}
   <defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#3ea6ff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
   <path d="${path}" fill="none" stroke="url(#lg)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
   ${pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.v)}" r="4.5" fill="#8b5cf6" stroke="#fff" stroke-width="1.5"><title>${esc(p.t || '')} ${num(p.v)}%</title></circle>`).join('')}</svg>`;
}
function hbars(rows, { suffix = '', max, cls = '' } = {}) {
  if (!rows.length) return `<div class="empty">No data yet</div>`;
  const m = max || Math.max(...rows.map(r => r.n), 1);
  return rows.map(r => `<div class="hbar"><span class="n" title="${esc(r.name)}">${esc(r.name)}</span><div class="bar ${cls}"><i data-w="${Math.max(2, r.n / m * 100)}"></i></div><span class="c">${num(r.n)}${suffix}</span></div>`).join('');
}
function animateIn(root = document) {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $$('[data-off]', root).forEach(c => c.style.strokeDashoffset = c.dataset.off);
    $$('[data-w]', root).forEach(b => b.style.width = b.dataset.w + '%');
    $$('[data-count]', root).forEach(el => {
      const to = parseFloat(el.dataset.count), dec = +(el.dataset.dec || 0), suf = el.dataset.suf || '';
      if (matchMedia('(prefers-reduced-motion:reduce)').matches) { el.textContent = to.toFixed(dec) + suf; return; }
      const t0 = performance.now(); const step = t => { const p = Math.min(1, (t - t0) / 1000), e = 1 - Math.pow(1 - p, 3); el.textContent = (to * e).toFixed(dec) + suf; if (p < 1) requestAnimationFrame(step); }; requestAnimationFrame(step);
    });
  }));
}

/* =====================================================================
   EXAM ENGINE  (correct answers are never sent to the browser)
   ===================================================================== */
let EX = null;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function seededShuffle(arr, seed) { const r = mulberry(seed), a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }
const hashStr = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return h; };
const LET = ['A', 'B', 'C', 'D'];
const exLeft = () => Math.round((EX.endAt - (Date.now() + EX.offset)) / 1000);

async function viewExam(testId, tok) {
  setApp(spinner());
  let d;
  try { d = await rpc('start_attempt', { p_test_id: testId }); }
  catch (e) { if (stale(tok)) return; toast(errMsg(e), 'error', 6000); location.hash = '#/test/' + testId; return; }
  if (stale(tok)) return;
  if (d.expired) { toast('Time was up – your attempt was submitted automatically.', 'warn', 6000); location.hash = '#/result/' + d.attempt_id; return; }
  const at = d.attempt; let qs = d.questions;
  if (d.test.shuffle_questions) qs = seededShuffle(qs, at.seed);
  if (d.test.shuffle_options) qs = qs.map(x => ({ ...x, options: seededShuffle(x.options, at.seed ^ hashStr(x.id)) }));
  const ans = new Map(); d.answers.forEach(a => ans.set(a.question_id, { o: a.selected_option_id, m: !!a.marked }));
  const pk = 'quizy_pending_' + at.id, pend = store.get(pk, {});
  Object.entries(pend).forEach(([qid, v]) => ans.set(qid, { o: v.o, m: v.m }));   // restore unsynced answers after refresh
  EX = { id: at.id, test: d.test, qs, idx: 0, ans, visited: new Set(qs.length ? [qs[0].id] : []), endAt: new Date(at.started_at).getTime() + at.duration_seconds * 1000, offset: new Date(d.server_now).getTime() - Date.now(), pk, pend, ver: 0, submitting: false, flushing: false, total: at.duration_seconds };
  if (!d.answers.length && Date.now() + EX.offset - new Date(at.started_at) < 4000) { await splash(); if (stale(tok)) { EX = null; return; } }

function parseCSV(text) {
  text = text.replace(/^﻿/, ''); const first = text.split(/\r?\n/)[0] || ''; const dl = first.includes(',') ? ',' : first.includes('\t') ? '\t' : first.includes(';') ? ';' : ','; const rows = []; let row = [], cur = '', inq = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inq) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inq = false; } else cur += c; }
    else if (c === '"') inq = true; else if (c === dl) { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; rows.push(row); row = []; } else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); } return rows.filter(r => r.some(x => x.trim() !== ''));
}
const hnorm = h => String(h).toLowerCase().replace(/[^a-z0-9]/g, '');

  const g = (...ks) => { for (const k of ks) if (o[k] != null && String(o[k]).trim() !== '') return String(o[k]).trim(); return ''; };
  const options = Array.isArray(o.options) ? o.options.map(x => String(x ?? '').trim()) : [g('optiona', 'a', 'option1', 'opta', 'opt1'), g('optionb', 'b', 'option2', 'optb', 'opt2'), g('optionc', 'c', 'option3', 'optc', 'opt3'), g('optiond', 'd', 'option4', 'optd', 'opt4')];
  const c = g('correct', 'answer', 'correctanswer', 'correctoption', 'ans'); let idx = -1;
  if (/^[A-Da-d]$/.test(c)) idx = 'ABCD'.indexOf(c.toUpperCase()); else if (/^[1-4]$/.test(c)) idx = +c - 1; else if (c) idx = options.findIndex(x => x.toLowerCase() === c.toLowerCase());
  return { question: g('question', 'text', 'q', 'questiontext'), options, correct: idx >= 0 ? idx + 1 : null, explanation: g('explanation', 'explain', 'solution'), image_url: g('imageurl', 'image', 'img') };
}
function checkQ(x) {
  if (!x.question) return 'Question text is empty'; if (x.question.length > 2000) return 'Question is longer than 2000 characters';
  if (!Array.isArray(x.options) || x.options.length !== 4) return 'Exactly 4 options required';
  for (let i = 0; i < 4; i++) { if (!x.options[i]) return `Option ${LET[i]} is empty`; if (x.options[i].length > 500) return `Option ${LET[i]} is too long`; }
  if (!x.correct) return 'Correct answer must be A, B, C, D (or 1-4)'; if (x.image_url && !/^https?:\/\//i.test(x.image_url)) return 'Image URL must start with http(s)://'; return null;

function parseBulk(text, name) {
  text = text.trim(); if (!text) throw new Error('Paste or choose a file first');

    items = j.map(o => { const k = {}; Object.keys(o || {}).forEach(key => k[hnorm(key)] = o[key]); if (Array.isArray(o?.options)) k.options = o.options; return normQ(k); });
  } else {
    const rows = parseCSV(text); if (rows.length < 2) throw new Error('CSV needs a header row and at least one question'); const hd = rows[0].map(hnorm);

  }

let AC = null;
function soundOn() { return !!store.get('quizy_sound', false); }
function sfx(kind) {
  if (!soundOn()) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const seq = { tick: [[660, .06]], mark: [[520, .08], [700, .08]], win: [[523, .12], [659, .12], [784, .12], [1047, .25]], lose: [[392, .15], [330, .15], [262, .3]], submit: [[440, .1], [660, .18]] }[kind] || [];
    let t = AC.currentTime;
    seq.forEach(([f, d]) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(.08, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d); t += d * .9; });
  } catch { }
}

function confetti() {
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const c = document.createElement('canvas'); c.className = 'confetti'; c.width = innerWidth; c.height = innerHeight; document.body.appendChild(c);
  const x = c.getContext('2d'), cols = ['#3ea6ff', '#8b5cf6', '#27e0a3', '#ffc23e', '#ff5c7a', '#ff4fd8'];
  const P = Array.from({ length: 90 }, () => ({ x: c.width / 2, y: c.height * .35, vx: (Math.random() - .5) * 12, vy: -Math.random() * 11 - 3, s: 5 + Math.random() * 6, c: cols[Math.random() * 6 | 0], r: Math.random() * 6, vr: (Math.random() - .5) * .4 }));
  let f = 0; (function step() { x.clearRect(0, 0, c.width, c.height); P.forEach(p => { p.vy += .28; p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); x.restore(); }); if (++f < 150) requestAnimationFrame(step); else c.remove(); })();
}

/* XP, level and daily streak – calculated from the student's own submitted attempts */
function gameStats(att) {
  const xp = Math.round(att.reduce((s, a) => s + Number(a.percentage) + (a.passed ? 20 : 0), 0));
  const level = Math.floor(Math.sqrt(xp / 50)) + 1, lo = 50 * (level - 1) ** 2, hi = 50 * level ** 2;
  const titles = ['Rookie', 'Explorer', 'Challenger', 'Scholar', 'Champion', 'Legend'];
  const days = new Set(att.map(a => new Date(a.submitted_at).toDateString()));
  let streak = 0; const d = new Date(); if (!days.has(d.toDateString())) d.setDate(d.getDate() - 1);
  while (days.has(d.toDateString())) { streak++; d.setDate(d.getDate() - 1); }
  return { xp, level, pct: (xp - lo) / (hi - lo) * 100, next: hi - xp, title: titles[Math.min(level - 1, 5)], streak, today: days.has(new Date().toDateString()) };
}

const pdfT = s => String(s ?? '').replace(/[^\x20-\x7E -ÿ]/g, '').trim() || '-';
function bestStreakOf(att) {
  const days = [...new Set(att.map(a => Math.round(new Date(a.submitted_at).setHours(0, 0, 0, 0) / 86400000)))].sort((x, y) => x - y);
  let best = 0, cur = 0, prev = null; days.forEach(d => { cur = prev !== null && d === prev + 1 ? cur + 1 : 1; best = Math.max(best, cur); prev = d; }); return best;
}
function hatTrick(att) { const a = [...att].reverse(); for (let i = 0; i + 2 < a.length; i++) if (a[i].passed && a[i + 1].passed && a[i + 2].passed) return true; return false; }
function heatSVG(att) {
  const counts = {}; att.forEach(a => { const k = new Date(a.submitted_at).toDateString(); counts[k] = (counts[k] || 0) + 1; });
  const c = 16, g = 4, today = new Date(); today.setHours(0, 0, 0, 0); const first = new Date(today); first.setDate(first.getDate() - 83); const off = first.getDay(), cols = Math.ceil((84 + off) / 7);
  let out = '';
  for (let i = 0; i < 84; i++) {
    const d = new Date(first); d.setDate(first.getDate() + i); const n = counts[d.toDateString()] || 0, col = Math.floor((i + off) / 7), row = d.getDay();
    out += `<rect x="${col * (c + g)}" y="${row * (c + g)}" width="${c}" height="${c}" rx="4" fill="${n === 0 ? 'rgba(120,150,255,.14)' : n === 1 ? 'rgba(62,166,255,.45)' : n === 2 ? 'rgba(62,166,255,.8)' : '#8b5cf6'}"><title>${d.toLocaleDateString()}: ${n} test(s)</title></rect>`;
  }
  const W = cols * (c + g), H = 7 * (c + g);
  return `<div class="scroll-x"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${Math.min(W, 300)}px;max-width:${W * 1.6}px" role="img" aria-label="Activity in the last 12 weeks">${out}</svg></div>`;
}
async function viewProgress(tok) {

  const bySub = {}; att.forEach(a => { const nm = subjName(byId(S.tests, a.test_id)?.subject_id) || 'Other'; (bySub[nm] = bySub[nm] || []).push(Number(a.percentage)); });

  const trend = att.slice(0, 15).reverse().map(a => ({ v: Number(a.percentage), t: testTitle(a.test_id) }));
  const ach = [['🚀', 'First Test', 'Complete 1 test', n >= 1], ['📚', 'Dedicated', 'Complete 10 tests', n >= 10], ['🏅', 'Veteran', 'Complete 25 tests', n >= 25], ['🔥', 'Week Streak', '7 days in a row', bs >= 7],
    ['🎯', 'High Scorer', 'Score 90% or more', att.some(a => a.percentage >= 90)], ['💯', 'Perfectionist', 'Score 100%', att.some(a => a.percentage >= 100)], ['🧠', 'Subject Master', 'Average 80%+ in a subject (3+ tests)', subs.some(s => s.c >= 3 && s.n >= 80)], ['⚡', 'Hat-trick', 'Pass 3 tests in a row', hatTrick(att)]];
  const tl = (e, k, v) => `<div class="tile"><span class="e">${e}</span><div class="k">${k}</div><div class="v" style="font-size:1.5rem">${v}</div></div>`;
  setApp(shell('progress', 'My progress', `<div class="card"><div class="mrow">${mascot(n ? 'happy' : 'think', 80)}<div style="flex:1"><b>Level ${gs.level} · ${gs.title}</b><div class="bar" style="margin:8px 0"><i data-w="${Math.max(2, gs.pct)}"></i></div><div class="tiny muted">${gs.xp} XP · ${gs.next} XP to next level</div></div></div></div>
   <div class="grid g4" style="margin:14px 0">${tl('📝', 'Tests', n)}${tl('⏱', 'Study time', fmtDur(tsec))}${tl('✅', 'Pass rate', num(passRate, 0) + '%')}${tl('🔥', 'Best streak', bs + 'd')}</div>
   <div class="row" style="margin-bottom:14px"><a class="btn btn-primary btn-sm" href="#/revise">📓 Revise my mistakes</a><a class="btn btn-ghost btn-sm" href="#/leaderboard">🏆 Leaderboard</a></div>
   <div class="card" style="margin-bottom:14px"><h2>🗓 Activity – last 12 weeks</h2>${heatSVG(att)}<div class="tiny muted" style="margin-top:6px">Darker = more tests that day</div></div>
   <div class="grid g2"><div class="card"><h2>📈 Recent scores</h2>${lineSVG(trend)}</div><div class="card"><h2>📚 Subject averages</h2>${hbars(subs, { suffix: '%', max: 100, cls: 'g' })}</div></div>
   <div class="card" style="margin-top:14px"><h2>🏅 Achievements <span class="small muted">${ach.filter(x => x[3]).length}/${ach.length} unlocked</span></h2><div class="grid g4">${ach.map(b => `<div class="badge3d ${b[3] ? '' : 'locked'}"><div class="b">${b[0]}</div><b class="small">${b[1]}</b><span class="tiny muted">${b[2]}</span></div>`).join('')}</div></div>`)); animateIn();
}

/* ---- mistake notebook (flashcards built from questions you got wrong) ---- */
let REV = { list: [], i: 0, shown: false };
async function viewRevise(tok) {
  setApp(shell('progress', 'Revise mistakes', spinner())); const list = await rpc('my_mistakes', { p_limit: 100 }); if (stale(tok)) return;
  REV = { list: list || [], i: 0, shown: false }; drawRevise();
}
function drawRevise() {
  const r = REV.list[REV.i];
  if (!r) { setApp(shell('progress', 'Revise mistakes', `<div class="card center">${mascot('cheer', 110)}<h2 style="justify-content:center;margin:10px 0">No mistakes to revise 🎉</h2><p class="muted" style="margin-bottom:14px">Questions you get wrong will show up here as flashcards.</p><a class="btn btn-primary" href="#/browse">Take a test</a></div>`)); return; }
  const sel = r.selected_option_id, cor = r.correct_option_id;
  setApp(shell('progress', 'Revise mistakes', `<div class="row between" style="margin-bottom:10px"><span class="chip purple">Card ${REV.i + 1} of ${REV.list.length}</span><span class="small muted">${esc(r.subject)} · ${esc(r.test_title)}</span></div>
   <div class="card"><div class="mrow" style="align-items:flex-start">${mascot(REV.shown ? 'happy' : 'think', 56)}<div class="qtext" style="flex:1">${esc(r.text)}</div></div>${safeUrl(r.image_url) ? `<img class="qimg" src="${esc(safeUrl(r.image_url))}" alt="Question image" loading="lazy">` : ''}
    <div class="qa" style="border:0;padding:0;background:none;margin:10px 0 0">${(r.options || []).map((o, k) => `<div class="o ${REV.shown ? (o.id === cor ? 'ok' : o.id === sel ? 'bad' : '') : ''}"><b>${LET[k]}.</b><span style="flex:1;white-space:pre-wrap">${esc(o.text)}</span>${REV.shown && o.id === cor ? '<span class="chip green">Correct</span>' : ''}${REV.shown && o.id === sel ? '<span class="chip red">You chose</span>' : ''}</div>`).join('')}</div>
    ${REV.shown ? (r.explanation ? `<div class="expl"><b>Explanation:</b> ${esc(r.explanation)}</div>` : '') : ''}
    <div class="row" style="margin-top:16px">${REV.shown ? `<button class="btn btn-success" data-act="rev-got">✅ Got it – remove</button>` : `<button class="btn btn-primary" data-act="rev-show">👁 Reveal answer</button>`}<button class="btn btn-ghost" data-act="rev-prev">← Prev</button><button class="btn btn-ghost" data-act="rev-next">Next →</button></div></div>`));
}
ACT['rev-show'] = () => { REV.shown = true; drawRevise(); };
ACT['rev-next'] = () => { REV.i = (REV.i + 1) % Math.max(1, REV.list.length); REV.shown = false; drawRevise(); window.scrollTo(0, 0); };
ACT['rev-prev'] = () => { REV.i = (REV.i - 1 + REV.list.length) % Math.max(1, REV.list.length); REV.shown = false; drawRevise(); window.scrollTo(0, 0); };
ACT['rev-got'] = () => { REV.list.splice(REV.i, 1); if (REV.i >= REV.list.length) REV.i = 0; REV.shown = false; drawRevise(); toast('Removed from this session', 'ok', 1500); };

/* ---- leaderboard with weekly / monthly / class filters ---- */

  const tab = (p, l) => `<button class="${LB.p === p ? 'on' : ''}" data-act="lb-p" data-p="${p}">${l}</button>`;

   <p class="small muted" style="margin-bottom:8px">Points = sum of your best percentage on each test. Registered students only.</p>${rows.map((r, i) => lbRow(r, i, me)).join('') || '<div class="empty">No rankings yet for this filter – submit a test to appear here!</div>'}${extra}</div>
   ${S.profile?.is_guest ? '<div class="card flat center" style="margin-top:14px"><p class="muted">Guests are not ranked.</p><button class="btn btn-primary btn-sm" style="margin-top:8px" data-act="upgrade">Register to join the leaderboard</button></div>' : ''}`));
}
ACT['lb-p'] = el => { LB.p = el.dataset.p; route(); };
INPUTS['lb-c'] = el => { LB.cls = el.value; route(); };

  doc.setFont('helvetica', 'normal'); doc.setFontSize(13); doc.setTextColor(200, 208, 240); doc.text('for successfully passing the test', cx, 116, { align: 'center' });
  doc.setFont('helvetica', 'bold'); doc.setFontSize(19); doc.setTextColor(62, 166, 255); const tl = doc.splitTextToSize(T(t.title), 230); doc.text(tl, cx, 130, { align: 'center' });
  doc.setFont('helvetica', 'normal'); doc.setFontSize(13); doc.setTextColor(255); doc.text(`${T(t.subject)}  |  ${T(t.class)}${t.stream ? ' - ' + T(t.stream) : ''}`, cx, 130 + tl.length * 8 + 4, { align: 'center' });
  doc.setFontSize(15); doc.text(`Score: ${num(a.score, 2)} / ${num(a.total_marks, 2)}   |   ${num(a.percentage, 1)}%`, cx, 130 + tl.length * 8 + 16, { align: 'center' });
  doc.setFontSize(10); doc.setTextColor(150, 160, 200); doc.text('Date: ' + new Date(a.submitted_at).toLocaleDateString(), 24, 186); doc.text('Created by ' + CREATOR + ' - ' + T(appName()), 273, 186, { align: 'right' }); doc.text('Practice certificate - not an official board document.', cx, 193, { align: 'center' });

/* ---- admin: per-question analysis + reset a student's attempt ---- */

const avatarInner = p => avatarOf(p) ? `<span style="font-size:1.9rem;line-height:1">${avatarOf(p)}</span>` : esc(initials(p?.full_name));

const testDiff = t => { const s = t.question_count ? t.duration_minutes * 60 / t.question_count : 60; return s < 40 ? '🔥 Hard' : s < 75 ? '⚡ Medium' : '🌱 Easy'; };
function totdCard() {
  const pool = S.tests.filter(t => testStatus(t) === 'live' && !attemptedSet.has(t.id) && t.question_count > 0 && inMed(t)); if (!pool.length) return '';
  const d = new Date(), t = pool[(d.getFullYear() * 372 + d.getMonth() * 31 + d.getDate()) % pool.length];
  return `<a class="card tcard t3d" href="#/test/${t.id}" style="margin-bottom:14px;background:linear-gradient(135deg,rgba(255,61,245,.22),rgba(18,214,255,.2))"><div class="mrow">${mascot('wow', 64)}<div style="flex:1;min-width:0"><span class="chip amber">🎯 Test of the day</span><h3 style="margin:6px 0 2px">${esc(t.title)}</h3>
    <div class="small muted">${esc(subjIcon(t.subject_id))} ${esc(subjName(t.subject_id))} · ⏱ ${t.duration_minutes} min · ${testDiff(t)} · ⭐ up to 120 XP</div></div><span class="btn btn-primary btn-sm">Play ▶</span></div></a>`;
}
function splash() {
  return new Promise(res => {
    if (matchMedia('(prefers-reduced-motion:reduce)').matches) return res();
    const d = document.createElement('div'); d.className = 'splash';
    d.innerHTML = `<div style="text-align:center">${mascot('cheer', 120)}<div class="sp-num" id="sp-num">3</div><div class="sp-txt">Get ready…</div></div>`; document.body.appendChild(d); let n = 3; sfx('tick');
    const bump = txt => { const e = $('#sp-num'); if (!e) return; e.textContent = txt; e.style.animation = 'none'; void e.offsetWidth; e.style.animation = ''; };
    const t = setInterval(() => { n--; if (n > 0) { bump(n); sfx('tick'); } else { bump('GO!'); sfx('win'); clearInterval(t); setTimeout(() => { d.remove(); res(); }, 550); } }, 700);
  });
}
